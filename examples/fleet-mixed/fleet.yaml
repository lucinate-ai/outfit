# A mixed fleet: a machine running `spinloop daemon` and two `spinloop cloud`
# environments, observed side by side. The same command reaches every node,
# whatever kind it is.
#
#   spinloop status, or spinloop metrics -w
#
# A daemon node names the machine (host) and the variable holding its bearer
# token (tokenEnv). A cloud node names its environment — its node name *is* the
# env. The token and the control URLs stay out of this file — in the .env and
# in each environment's cloud.json — so it names machines and environments,
# never secrets or accounts.
#
# None of the three nodes below declares a `file` field: each one's own name
# is already a subdirectory beside this file (gpu-box/Spinloop, qwen/Spinloop,
# llama/Spinloop) — what `fleet start`/`fleet deploy` read to know what a node
# runs, with nothing to declare beyond the node's own name.
nodes:
  # A GPU box on the network, reached over the daemon's control API.
  - name: gpu-box
    host: 198.51.100.7
    port: 4242
    tokenEnv: GPU_BOX_TOKEN

  # Two cloud environments, driven through their control plane.
  - name: qwen
    kind: cloud

  - name: llama
    kind: cloud
