# The fleet the compose stack brings up. Ports are the host-side mappings from
# compose.yaml, so this works from your machine with the stack running.
#
# No secrets here: each node names the environment variable holding its token,
# resolved from your environment or the .env beside this file.
nodes:
  - name: studio
    host: 127.0.0.1
    port: 14242
    tokenEnv: STUDIO_TOKEN

  - name: gpu-box
    host: 127.0.0.1
    port: 14243
    tokenEnv: GPU_BOX_TOKEN

  - name: laptop
    host: 127.0.0.1
    port: 14244
    tokenEnv: LAPTOP_TOKEN
