# A llama.cpp preset for Qwen3.8-27B, mirroring the llama-server command in
# this directory's README. `outfit serve` turns it into that command and runs it,
# whether that's on your own machine or on an `outfit remote` GPU.
# See https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

[*]
host  = 127.0.0.1
port  = 8080
jinja = 1            # required for Qwen3 tool calling
ngl   = 99           # offload all layers to the GPU; lower for limited VRAM

# Qwen's recommended sampling parameters for *thinking* mode (the model's
# default). llama.cpp's own defaults (temp 0.8, top-k 40, min-p 0.05,
# repeat-penalty 1.1) differ from these, so they're set explicitly here rather
# than left implicit. Non-thinking mode wants a different set — see the
# README's "Recommended settings" section.
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
repeat-penalty   = 1.0
presence-penalty = 0.0

[qwen3.8-27b]         # the Outfit's ALIAS selects this section
hf       = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
ctx-size = 32768      # keep in step with the Outfit's CONTEXT
