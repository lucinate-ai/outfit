# A llama.cpp preset for Muse-Glimmer-30B, targeting Meta's K-Quant-Dynamic
# build — the ~32GB-VRAM tier, 19.65 GB on disk, quoted at 0.2% degradation
# against full precision.
#
# Needs a llama.cpp built from master at or after commit 62bf73d2
# ("model: Muse Glimmer Support", PR #26841, merged 2026-08-10). No tagged
# release carried it at the time of writing. See README.md.
#
# `outfit serve` turns this into a llama-server command and runs it.
# See https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

[*]
host  = 127.0.0.1
port  = 8080
jinja = 1            # chat template + tool calling
ngl   = 99           # offload all layers; right for Metal and for CUDA

# Sampling settings Meta recommends for this model.
temp  = 1.0
top-p = 0.95
top-k = 64

[muse-glimmer-30b]   # the Outfit's ALIAS selects this section
# Repo and file are set separately: Meta's filenames aren't standard quant
# scheme names, so the `-hf repo:TAG` shorthand can't resolve them.
# `hf` is llama-server's --hf-repo, `hff` is --hf-file.
hf       = meta-models/Muse-Glimmer-30B-GGUF
hff      = muse-glimmer-30B-kquant-dynamic.gguf
ctx-size = 32768     # keep in step with the Outfit's CONTEXT

# Image input needs the perception encoder alongside the main weights. Download
# mmproj-kquant.gguf from the same repo and point at it:
# mmproj = /path/to/mmproj-kquant.gguf
#
# Speculative decoding via the DFlash drafter is NOT usable with Meta's
# published dflash-kquant.gguf on upstream llama.cpp — the merge deliberately
# broke compatibility with it (Q/K stored in NEOX/rotated-half format). Leaving
# it out; see README.md.
