# A llama.cpp preset for Muse-Glimmer-30B, targeting the K-Quant-Dynamic tier
# (~32GB VRAM per the model card) — comfortably under a single L40S's 48GB, so
# it fits the default `g6e.xlarge` this repo's remote/ stack boots.
# `outfit serve` turns this into a llama-server command and runs it locally;
# `outfit remote deploy` reads the same file for the cloud endpoint (host,
# port, model and ctx-size are cloud-owned there and dropped automatically).
# See https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

[*]
host  = 127.0.0.1
port  = 8080
jinja = 1            # use the model's built-in chat template; check tool-calling
                      # behaviour once it's up — verify this is still needed
ngl   = 99           # offload all layers to the GPU; lower for limited VRAM

[muse-glimmer-30b]   # the Outfit's ALIAS selects this section
# TODO: fill in the exact repo + quant tag from the "Quantizations" tab at
# https://huggingface.co/meta-models/Muse-Glimmer-30B — this targets the
# K-Quant-Dynamic tier. Format is org/repo:QUANT (see README.md in this
# directory for how to find it).
hf       = meta-models/Muse-Glimmer-30B-GGUF:REPLACE_WITH_DYNAMIC_QUANT_TAG
ctx-size = 32768     # keep in step with the Outfit's CONTEXT
