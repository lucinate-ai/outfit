# A llama.cpp preset for Muse-Glimmer-30B, targeting Meta's K-Quant-Dynamic
# build — the ~32GB-VRAM tier, 19.65 GB on disk, quoted at 0.2% degradation
# against full precision. Text-only. Speculative decoding is off pending an
# upstream bug — see the DFlash note at the bottom of this file.
#
# Needs a llama.cpp built at or after commit 62bf73d2 ("model: Muse Glimmer
# Support", PR #26841, merged 2026-08-10). Release b10355 onwards carries it.
#
# `outfit serve` turns this into a llama-server command and runs it.
# See https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

[*]
host  = 127.0.0.1
port  = 8080
ngl   = 99           # offload all layers; right for Metal and for CUDA

# MANDATORY, not a nicety. The chat template is embedded in the GGUF and
# nothing else supplies it: --chat-template-file is not needed, and without
# --jinja the multimodal CLI aborts outright with "this custom template is not
# supported, try using --jinja".
jinja = 1

# Sampling settings Meta recommends for this model.
temp  = 1.0
top-p = 0.95
top-k = 64

# Reasoning cannot be turned off — the template opens the thinking channel
# unconditionally, so --reasoning off and "reasoning_effort": "none" do
# nothing. You control how much, via this template variable: low | medium |
# high | xhigh, defaulting to high. Use high or xhigh for coding and agentic
# work. Per-request, send "chat_template_kwargs" instead. To hard-cap thinking
# tokens, add `reasoning-budget = N`.
chat-template-kwargs = {"reasoning_strength":"high"}

[muse-glimmer-30b]   # the Outfit's ALIAS selects this section
# Repo and file are set separately: Meta's filenames aren't standard quant
# scheme names, so the `-hf repo:TAG` shorthand can't resolve them.
# `hf` is llama-server's --hf-repo, `hff` is --hf-file.
hf       = meta-models/Muse-Glimmer-30B-GGUF
hff      = muse-glimmer-30B-kquant-dynamic.gguf
# `-c` is the server TOTAL and is divided across `-np` slots, so one request
# gets ctx-size/np. Scaled here so each of the 4 slots gets the model's full
# trained 131072, per Meta's own guidance. Do not "trim" this to 131072 and
# leave np at 4: each slot then holds 32768, and a generation that runs out of
# slot context does not error — it returns no answer at all. Check n_ctx_slot
# in the startup log. (The Outfit's CONTEXT overrides this value; see the note
# there.)
ctx-size = 524288    # 131072 per slot x 4 slots
np       = 4         # --parallel: 4 concurrent slots

# Text-only. The repo publishes mmproj-kquant.gguf beside the weights and
# --hf-repo would otherwise fetch and load it automatically, adding 1.4 GB for
# an image path we don't want here.
no-mmproj = 1

fa = on              # flash attention

# DFlash speculative decoding is DELIBERATELY OFF — it does not work with this
# repo's GGUF, and enabling it does not merely lose the speedup, it crashes the
# server at load:
#
#   vector::_M_range_check: __n (which is 1) >= this->size() (which is 1)
#
# Meta's official GGUF encodes muse-glimmer.attention.sliding_window_pattern as
# an ARRAY; the DFlash bind path only handles the scalar form. Tracked upstream
# as ggml-org/llama.cpp#26894, still open. It is a metadata path, so this is not
# CUDA- or Metal-specific. PR #26900 is NOT the fix (its author struck out
# "Nixes #26894").
#
# When that issue closes, restore speculative decoding by uncommenting these —
# `--spec-type draft-dflash` is required because DFlash is block-diffusion, not
# an ordinary autoregressive draft, and llama.cpp would otherwise fall back to
# draft-simple. Meta's own model card omits the flag.
#
#   spec-type        = draft-dflash
#   spec-draft-model = ./Muse-Glimmer-30B-GGUF/dflash-kquant.gguf
#   spec-draft-ngl   = 999    # offload every drafter layer too
#   spec-draft-n-max = 16     # clamped to the drafter's trained block size
#
# `outfit remote deploy` reads spec-draft-model to carry the drafter to the
# cloud as a companion weight, so uncommenting is all that is needed there too.
# The drafter is not fetchable with --hf-repo/-hfd (that resolves a repo to one
# file, and this repo's default is the 17GB build), so download it locally:
#   hf download meta-models/Muse-Glimmer-30B-GGUF \
#     --include "dflash-kquant.gguf" --local-dir ./Muse-Glimmer-30B-GGUF
