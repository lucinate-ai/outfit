# A llama.cpp preset for Muse-Glimmer-30B, targeting Meta's K-Quant-Dynamic
# build — the ~32GB-VRAM tier, 19.65 GB on disk, quoted at 0.2% degradation
# against full precision. Text-only, with DFlash speculative decoding on.
#
# Needs a llama.cpp built at or after commit 62bf73d2 ("model: Muse Glimmer
# Support", PR #26841, merged 2026-08-10) — release b10353 onwards. For working
# parallel tool calling you want b10423 or newer, which is where the EOM fix
# (0b1bad14) first reached a release. See README.md.
#
# `spinloop serve` turns this into a llama-server command and runs it.
# See https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

[*]
host  = 127.0.0.1
port  = 8080
ngl   = 99           # offload all layers; right for Metal and for CUDA

# MANDATORY, not a nicety. The chat template is embedded in the GGUF and
# nothing else supplies it: --chat-template-file is not needed, and without
# --jinja the multimodal CLI aborts outright with "this custom template is not
# supported, try using --jinja".
jinja = 1

# Sampling settings Meta recommends for this model.
temp  = 1.0
top-p = 0.95
top-k = 64

# Reasoning cannot be turned off — the template opens the thinking channel
# unconditionally, so --reasoning off and "reasoning_effort": "none" do
# nothing. You control how much, via this template variable: low | medium |
# high | xhigh, defaulting to high. Use high or xhigh for coding and agentic
# work. Per-request, send "chat_template_kwargs" instead. To hard-cap thinking
# tokens, add `reasoning-budget = N`.
chat-template-kwargs = {"reasoning_strength":"high"}

[muse-glimmer-30b]   # the Spinloop's ALIAS selects this section
# Repo and file are set separately. `hf` is llama-server's --hf-repo, `hff` is
# --hf-file. Get the filename exactly right — llama-server rejects a miss with
# "file 'X' not found in repository" and then fails to load an empty path.
# Meta renamed every file in this repo in August 2026; these are the current
# names, checked against the repo listing.
hf       = meta-models/Muse-Glimmer-30B-GGUF
hff      = Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf

# `-c` is the server TOTAL and is divided across `-np` slots, so one request
# gets ctx-size/np. One slot at the model's full trained 131072, because that
# is what fits on a 32 GB Mac once the drafter is loaded — see the memory
# budget below. Raising `np` without raising `-c` shrinks every slot, and a
# generation that runs out of slot context does not error, it returns no answer
# at all. Check n_ctx_slot in the startup log. (The Spinloop's CONTEXT
# overrides this value; see the note there.)
ctx-size = 131072    # 131072 per slot x 1 slot
np       = 1         # --parallel: 1 concurrent slot

# Text-only. The repo publishes mmproj-Muse-Glimmer-30B-Q4_K_M.gguf beside the
# weights and --hf-repo would otherwise fetch and load it automatically, adding
# 1.4 GB for an image path we don't want here.
no-mmproj = 1

fa = on              # flash attention

# --- DFlash speculative decoding ------------------------------------------
#
# `--spec-type draft-dflash` is required and does two things. It selects the
# block-diffusion draft path — without it llama.cpp uses draft-simple, ordinary
# autoregressive drafting, which is the wrong shape for a drafter that emits a
# block of 16 tokens per forward pass. It also sets download_dflash on the
# --hf-repo plan, so llama-server finds the `dflash-` sibling in the same repo
# and fetches it (1.63 GB) without a separate download or a --spec-draft-model
# path. Meta's own model card omits the flag.
spec-type       = draft-dflash
spec-draft-ngl  = 999   # offload every drafter layer too
spec-draft-n-max = 15   # dflash.block_size is 16, and in-place denoising yields
                        # at most block_size-1 tokens. Asking for 16 logs
                        # "exceeds the trained block size" and clamps to 15.
#
# This drafter is DFlash v1, not DFlash2. DFlash2 (PR #27816, merged
# 2026-08-27) is not a flag or a --spec-type — llama.cpp detects it from the
# drafter's `dflash.selector_top_k` metadata key and its selector_* tensors.
# Meta's dflash-Muse-Glimmer-30B-Q4_K_M.gguf has 33 metadata keys and no
# selector_top_k, so is_dflash2 stays false. There is nothing to enable until
# someone publishes a DFlash2 sidecar for this model.
#
# MEMORY. On a 32 GB Apple Silicon machine this is close to the ceiling, and
# overrunning it is what produces the crash reported as
# ggml-org/llama.cpp#26894:
#
#   vector::_M_range_check: __n (which is 1) >= this->size() (which is 1)
#
# That report originally blamed GGUF metadata (an array-valued
# sliding_window_pattern). The reporter retracted that on 2026-08-13. The
# confirmed cause is in the default layer-split path in llama-model.cpp: when
# every device reports 0 bytes free, the split normalisation divides by zero,
# the resulting NaNs make std::upper_bound return end(), and devices.at() throws
# that message. It fires when the target model plus its KV cache has consumed
# the device by the time the drafter loads, so it is a pure function of
# --ctx-size. PR #26900 did NOT fix it (its author struck out "Nixes #26894");
# PR #28221 is the open guard.
#
# The budget as configured, against 24.96 GiB of Metal working set on a 32 GB
# M4 (read it with recommendedMaxWorkingSetSize):
#
#   weights   Q4_K_XL                                   18.3 GiB
#   drafter   dflash Q4_K_M                              1.5 GiB
#   KV cache  13 full-attention layers x 131072 x 1 KiB  1.6 GiB
#             39 sliding layers, capped at the 2048 window ~0.2 GiB
#   compute buffers                                     ~1.0 GiB
#                                                       ---------
#                                                       ~22.6 GiB
#
# KV is 1 KiB per layer per token because the model is GQA with 2 KV heads at
# head_dim 128, and 39 of its 52 layers are sliding-window. Four slots at
# `ctx-size = 524288` costs 6.5 GiB of KV instead of 1.6 and does not fit with
# the drafter loaded. If you want the concurrency, either drop to
# Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf (1.0% degradation instead of 0.2%,
# 2.7 GB smaller) or halve the KV with `ctk = q8_0` and `ctv = q8_0`.
#
# `spinloop cloud deploy` does not read --hf-repo's auto-download, so the
# cloud path needs the drafter named explicitly:
#
#   spec-draft-model = ./Muse-Glimmer-30B-GGUF/dflash-Muse-Glimmer-30B-Q4_K_M.gguf
#
# Deploy takes the basename and asks the seed for that file from the model's
# own repo, and the seed matches companions by exact filename — so a stale name
# fails the deploy. See the "Deploying to the cloud" section of README.md.
