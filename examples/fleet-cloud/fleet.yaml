# A fleet of `spinloop cloud` environments, observed like machines.
#
#   spinloop status                # one row per environment: state and what it serves
#   spinloop metrics -w    # a live dashboard
#   spinloop fleet deploy --all  # create both environments from this file
#
# Each node's `name` is the registered environment it drives — one per
# `spinloop cloud deploy`, or per `spinloop fleet deploy` — and what you type
# at `fleet start <node>`. `kind: cloud` marks it as a cloud environment
# rather than a host. No bearer tokens here: the control plane signs each
# call, and the environment's URLs live in its cloud.json, not in this file.
# So, like every fleet file, this one names environments, never an account.
#
# `fleet deploy` needs to know what each environment serves — the same thing
# `spinloop cloud deploy <file>` needs, just resolved from the node rather
# than typed on the command line. Neither node here declares a `file` field:
# each one's own name is a subdirectory beside this file (qwen/Spinloop,
# llama/Spinloop) — the convention for a fleet laid out as one subdirectory
# per node, with nothing to declare beyond the node's name. (A registered
# `spinloop alias` named after a node would resolve the same way, and win
# over the subdirectory if both existed.) See
# [`examples/fleet-docker`](../fleet-docker/) for a `file` field pointing
# somewhere that does *not* match the node's own name.
nodes:
  - name: qwen
    kind: cloud
    instance-type: g6e.2xlarge   # EC2 type this environment launches as (default: the control plane's)

  - name: llama
    kind: cloud
