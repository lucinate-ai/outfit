# An oMLX preset for Gemma-4-E2B, mirroring the omlx-cli command in this
# directory's README. `outfit serve` turns it into that command and runs it.
#
# These are `omlx-cli serve` flags with their leading dashes stripped. Note that
# they are NOT llama.cpp's: each engine's preset is read in its own vocabulary,
# so this file is not interchangeable with the ones under examples/llamacpp/.
#
# Paths are passed to the server verbatim, so `~` is not expanded — spell them
# out in full.

[*]
host = 127.0.0.1
port = 8000

[default]                          # served with no ALIAS: the only section
model-dir               = /Users/you/models
memory-guard            = safe     # this model is small; safe leaves ample room
max-concurrent-requests = 8
