schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  outfit is a Go CLI that configures a coding agent — a "harness" (opencode,
  Pi or lucinate) — to use a model provider, by deep-merging provider settings
  into that harness's config; it also serves, fleets and remotely deploys local
  inference engines.

  Tech stack: Go; domain logic in internal/ packages (catalog, config,
  contextsize, daemon, fleet, harness, lucinate, opencode, outfit, outfitsrc,
  pi, preset, remote), CLI in cmd/outfit on Cobra (command tree + pflag flags)
  with Viper as the CLI-layer binding surface for OUTFIT_ALIAS, OUTFIT_REMOTE_*
  and OUTFIT_REMOTE_PACKAGE_MANAGER; shell tab completion is Cobra's own
  __complete engine plus the scripts it generates. The only AWS/network
  dependency is aws-sdk-go-v2 in internal/remote. Providers/models are data in
  internal/catalog/providers.yaml, not Go code.

  Conventions: keep test coverage >= 80% (go test ./... -cover); gofmt before
  committing; AGENTS.md documents the architecture and its invariants (in-place
  merges that never drop user config, 0600 for files that may hold secrets,
  the harness never appears in an Outfit file).

