# llama.cpp preset for the endpoint this repo deploys — the section name matches
# the Outfit's ALIAS, which is what selects it.
#
# `outfit remote deploy` turns this into the deploy config: `hf` names the
# weights (repo:QUANT) and the rest become the server's flags. Settings the
# cloud owns are dropped from it — host, port, api-key, ctx-size (CONTEXT), the
# alias, and metrics — so this same file also runs the model locally with
# `outfit serve`, where those values do apply.
# See https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

[*]
host  = 127.0.0.1     # local serve only; the cloud binds 0.0.0.0
port  = 8080          # local serve only
jinja = 1             # required for Qwen3.6 tool calling
ngl   = 99            # offload every layer to the GPU

[qwen3.6-27b]
# Unsloth's MTP build: the multi-token-prediction draft is inside this GGUF, so
# no separate draft file is downloaded.
hf           = unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q6_K_XL
ctx-size     = 131072   # keep in step with the Outfit's CONTEXT
fa           = on       # flash attention, needed for the quantised KV cache
cache-type-k = q8_0     # a q8 KV cache keeps 128k of context inside 48 GB
cache-type-v = q8_0
np           = 1        # MTP does not support parallel sequences
# Multi-token prediction: the draft proposes tokens the model verifies in one
# pass. Worth ~1.5-2x on decode; llama-server logs the acceptance rate.
spec-type        = draft-mtp
spec-draft-n-max = 2
