# Provider catalogue for outfit.
#
# This file is embedded into the binary at build time (see //go:embed in
# catalog.go) but kept external so providers and endpoints can be maintained
# without touching the Go code.
#
# The catalogue is provider *plumbing* only — it does not enumerate models. The
# model a provider serves is named by the selection (MODEL/ALIAS in an Outfit,
# or --model/--alias on the command line); any model id passes through.
#
# Per provider:
#   name            display name written into the opencode config (optional)
#   npm             SDK package for custom providers (e.g. openai-compatible)
#   description     shown by `outfit list`
#   apiKeyEnv       env var (looked up in .env, then the environment) whose
#                   value is injected as options.apiKey
#   apiKeyRequired  fail if apiKeyEnv resolves to nothing
#   apiKeyOptional  the provider also works with no key (a local server). When
#                   apiKeyEnv resolves to nothing, the Pi harness writes its
#                   keyless placeholder instead of an unresolvable $VAR
#   apiKeyPrefix    sanity-check that the key starts with this
#   options         static options merged into the provider block
#   optionsFromEnv  option -> env var; injected into options when the var is set
#   optionsRequired list of option keys that must resolve to a non-empty value
#                   (from options or optionsFromEnv); applying the provider fails
#                   otherwise. For a caller-supplied option with no usable
#                   default (e.g. a Vertex AI project) on a keyless provider.
#   pi              optional block marking the provider as usable by the Pi
#                   harness (~/.pi/agent/models.json). Holds:
#                     api      Pi protocol: openai-completions | openai-responses
#                              | anthropic-messages | google-generative-ai
#                     baseUrl  Pi endpoint (optional; falls back to
#                              options.baseURL). Providers without a pi block
#                              are reported as unsupported by the Pi harness.

providers:
  openrouter:
    description: OpenRouter model aggregator
    apiKeyEnv: DEEPSEEK_API_KEY
    apiKeyRequired: true
    apiKeyPrefix: sk-or-
    pi:
      api: openai-completions
      baseUrl: https://openrouter.ai/api/v1

  amazon-bedrock:
    description: AWS Bedrock (authenticates via your AWS credentials)
    # No apiKey is injected: the AWS SDK reads AWS_PROFILE / AWS_ACCESS_KEY_ID /
    # etc. Override the region with AWS_REGION or by editing options.region.
    options:
      region: us-east-1
    optionsFromEnv:
      region: AWS_REGION

  google-vertex:
    description: Gemini on GCP Vertex AI (authenticates via your Google credentials)
    # No apiKey is injected: the Vertex SDK reads Application Default Credentials
    # (run `gcloud auth application-default login`, or point
    # GOOGLE_APPLICATION_CREDENTIALS at a service-account key file). The project
    # is required (there is no sensible default); the location defaults to
    # `global` and is overridable with GOOGLE_VERTEX_LOCATION.
    options:
      location: global
    optionsRequired:
      - project
    optionsFromEnv:
      project: GOOGLE_VERTEX_PROJECT
      location: GOOGLE_VERTEX_LOCATION

  google-vertex-anthropic:
    description: Claude on GCP Vertex AI (authenticates via your Google credentials)
    # Same authentication and options as google-vertex; this provider serves
    # Anthropic Claude models rather than Gemini.
    options:
      location: global
    optionsRequired:
      - project
    optionsFromEnv:
      project: GOOGLE_VERTEX_PROJECT
      location: GOOGLE_VERTEX_LOCATION

  ollama:
    description: Local Ollama server (OpenAI-compatible API)
    name: Ollama (local)
    npm: "@ai-sdk/openai-compatible"
    options:
      baseURL: http://localhost:11434/v1
    optionsFromEnv:
      baseURL: OLLAMA_BASE_URL
    pi:
      api: openai-completions

  llamacpp:
    description: llama.cpp server (OpenAI-compatible API)
    name: llama.cpp
    npm: "@ai-sdk/openai-compatible"
    # A local llama-server usually needs no key, and none is injected when the
    # var is unset. But the same provider also names a remote deployment (see
    # `outfit remote deploy`), which is started with --api-key, so the key is
    # picked up when there is one.
    apiKeyEnv: OPENAI_API_KEY
    apiKeyOptional: true
    options:
      baseURL: http://localhost:8080/v1
    optionsFromEnv:
      baseURL: LLAMACPP_BASE_URL
    pi:
      api: openai-completions

  vllm:
    description: vLLM server (OpenAI-compatible API)
    name: vLLM
    npm: "@ai-sdk/openai-compatible"
    # vLLM is started with an API key when exposed beyond localhost (as the
    # cloud-vm-llm deployment does), so the key is injected when the var is set.
    apiKeyEnv: OPENAI_API_KEY
    options:
      baseURL: http://localhost:8000/v1
    optionsFromEnv:
      baseURL: VLLM_BASE_URL
    pi:
      api: openai-completions

  openai-compatible:
    description: Generic OpenAI-compatible endpoint (set base URL and key via env)
    name: OpenAI-compatible
    npm: "@ai-sdk/openai-compatible"
    apiKeyEnv: OPENAI_API_KEY
    options:
      baseURL: https://api.openai.com/v1
    optionsFromEnv:
      baseURL: OPENAI_BASE_URL
    pi:
      api: openai-completions
